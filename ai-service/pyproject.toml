[project]
name = "healthbridge-ai"
version = "0.1.0"
description = "HealthBridge AI service: document intelligence, retrieval and bounded agent workflows."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.11,<2",
    "fastapi>=0.115",
    "httpx>=0.28",
    "langgraph>=0.6",
    "pillow>=11",
    "prometheus-client>=0.21",
    "psycopg[binary,pool]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyjwt>=2.10",
    "pypdf>=5",
    "pytesseract>=0.3.13",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[tool.uv]
# Application, not a library: install dependencies only.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
