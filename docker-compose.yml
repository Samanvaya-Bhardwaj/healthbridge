# HealthBridge local stack.
#
#   node scripts/generate-env.mjs        # once: creates .env with random local secrets
#   docker compose up -d --build --wait  # build and start everything
#   open http://localhost:${HOST_PORT_WEB} (8080 unless generate-env picked another free port)
#
# Host ports bind to 127.0.0.1 only. The AI service is not published at all;
# it is reachable only by the API on the private network (ADR-0001).

name: healthbridge

x-backend-env: &backend-env
  APP_ENV: ${APP_ENV:-development}
  NODE_ENV: production
  DEMO_MODE: ${DEMO_MODE:-true}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  DB_HOST: postgres
  DB_PORT: 5432
  POSTGRES_DB: ${POSTGRES_DB:?run node scripts/generate-env.mjs}
  DB_APP_USER: ${DB_APP_USER:?}
  DB_APP_PASSWORD: ${DB_APP_PASSWORD:?}
  DB_AI_USER: ${DB_AI_USER:?}
  DB_POOL_MAX: ${DB_POOL_MAX:-10}
  REDIS_HOST: redis
  REDIS_PORT: 6379
  REDIS_PASSWORD: ${REDIS_PASSWORD:?}
  S3_ENDPOINT: http://minio:9000
  S3_REGION: ${S3_REGION:-ap-south-1}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?}
  S3_BUCKET_DOCUMENTS: ${S3_BUCKET_DOCUMENTS:?}
  S3_FORCE_PATH_STYLE: 'true'
  SMTP_HOST: mailpit
  SMTP_PORT: 1025
  MAIL_FROM: ${MAIL_FROM:-HealthBridge Demo <no-reply@healthbridge.local>}
  API_PORT: 4000
  METRICS_PORT: 9464
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://localhost:5173}
  PUBLIC_APP_URL: ${PUBLIC_APP_URL:-}
  TRUST_PROXY: 1
  AI_SERVICE_URL: http://ai-service:8000
  INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:?}
  AUTH_JWT_PRIVATE_KEY: ${AUTH_JWT_PRIVATE_KEY:?run node scripts/generate-env.mjs --update}
  AUTH_JWT_PREVIOUS_PUBLIC_KEYS: ${AUTH_JWT_PREVIOUS_PUBLIC_KEYS:-}
  AUTH_ACCESS_TOKEN_TTL_SECONDS: ${AUTH_ACCESS_TOKEN_TTL_SECONDS:-600}
  AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-true}
  DEMO_USER_PASSWORD: ${DEMO_USER_PASSWORD:-}
  PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-fake}
  PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:?run node scripts/generate-env.mjs --update}
  RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
  RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
  NOTIFICATION_EMAIL_PROVIDER: ${NOTIFICATION_EMAIL_PROVIDER:-smtp}
  REMINDER_OFFSETS_MINUTES: ${REMINDER_OFFSETS_MINUTES:-1440,60}
  WORKER_METRICS_PORT: 9465
  # Browser-facing endpoint for presigned document URLs (Nginx proxies the bucket path).
  S3_PUBLIC_ENDPOINT: http://localhost:${HOST_PORT_WEB:-8080}
  DOCUMENT_SCANNER: ${DOCUMENT_SCANNER:-fake}
  CLAMAV_HOST: ${CLAMAV_HOST:-}
  DOCUMENT_MAX_BYTES: ${DOCUMENT_MAX_BYTES:-10485760}
  DOCUMENT_DOWNLOAD_URL_TTL_SECONDS: ${DOCUMENT_DOWNLOAD_URL_TTL_SECONDS:-60}
  # Consultations (ADR-0025)
  VIDEO_PROVIDER: ${VIDEO_PROVIDER:-mock}
  LIVEKIT_URL: ${LIVEKIT_URL:-}
  LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-}
  LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}
  CLINICAL_DATA_KEY: ${CLINICAL_DATA_KEY:-}
  CLINICAL_DATA_KEY_ID: ${CLINICAL_DATA_KEY_ID:-k1}
  CLINICAL_DATA_PREVIOUS_KEYS: ${CLINICAL_DATA_PREVIOUS_KEYS:-}

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?}
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --data-checksums
      DB_APP_USER: ${DB_APP_USER:?}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:?}
      DB_AI_USER: ${DB_AI_USER:?}
      DB_AI_PASSWORD: ${DB_AI_PASSWORD:?}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - '127.0.0.1:${HOST_PORT_POSTGRES:-5432}:5432'
    networks: [private]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?}
      - --appendonly
      - 'yes'
      - --maxmemory-policy
      - noeviction # required by BullMQ: queued jobs must never be evicted
    volumes:
      - redis-data:/data
    ports:
      - '127.0.0.1:${HOST_PORT_REDIS:-6379}:6379'
    networks: [private]
    healthcheck:
      test: ['CMD-SHELL', 'REDISCLI_AUTH="$${REDIS_PASSWORD}" redis-cli ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?}
    restart: unless-stopped

  minio:
    # MinIO no longer publishes community images to Docker Hub/Quay; Chainguard maintains a
    # rebuilt image. Pinned by digest for reproducibility (ADR-0013).
    image: cgr.dev/chainguard/minio@sha256:4692462f35d97d7e82c30371d82f057703c5d9489bcae726010594c812f2d285
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?}
    volumes:
      - minio-data:/data
    ports:
      - '127.0.0.1:${HOST_PORT_MINIO:-9000}:9000'
      - '127.0.0.1:${HOST_PORT_MINIO_CONSOLE:-9001}:9001'
    # storage: reachable by Nginx for presigned document requests only.
    networks: [private, storage]
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        # Pure bash (the image has no curl/wget/grep): read the HTTP status line.
        - 'exec 3<>/dev/tcp/127.0.0.1/9000 && printf "GET /minio/health/live HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3 && read -r status <&3 && [[ "$$status" == *" 200 "* ]]'
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.29
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 'true'
      MP_SMTP_AUTH_ALLOW_INSECURE: 'true'
    ports:
      - '127.0.0.1:${HOST_PORT_MAILPIT_UI:-8025}:8025' # web UI
      - '127.0.0.1:${HOST_PORT_SMTP:-1025}:1025' # SMTP
    networks: [private]
    restart: unless-stopped

  # One-shot: apply database migrations as the schema owner, then exit.
  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: healthbridge-backend:local
    command: ['node', 'scripts/migrate.js', 'latest']
    environment:
      <<: *backend-env
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    depends_on:
      postgres: { condition: service_healthy }
    networks: [private]
    restart: 'no'

  # One-shot: create the documents bucket (local/CI only; IaC in production).
  storage-init:
    image: healthbridge-backend:local
    command: ['node', 'scripts/bootstrap-storage.js']
    environment: *backend-env
    depends_on:
      minio: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    networks: [private]
    restart: 'no'

  api:
    image: healthbridge-backend:local
    environment: *backend-env
    depends_on:
      migrate: { condition: service_completed_successfully }
      storage-init: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    ports:
      - '127.0.0.1:${HOST_PORT_API:-4000}:4000'
    networks: [private, edge]
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 4s
      start_period: 20s
      retries: 6
    restart: unless-stopped

  # Background workers (ADR-0020): outbox relay, notifications, payments, reminders,
  # payment-hold expiry. Same image as the API. Only the read-only Bull Board is
  # published, on the loopback interface (never through Nginx; ADR-0027).
  worker:
    image: healthbridge-backend:local
    command: ['node', 'src/worker.js']
    environment:
      <<: *backend-env
      # Worker only: the API never needs the board credentials.
      BULL_BOARD_USERNAME: ${BULL_BOARD_USERNAME:-ops}
      BULL_BOARD_PASSWORD: ${BULL_BOARD_PASSWORD:-}
    ports:
      - '127.0.0.1:${BULL_BOARD_HOST_PORT:-3010}:9466'
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      postgres: { condition: service_healthy }
    networks: [private]
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:9465/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 4s
      start_period: 20s
      retries: 4
    # Active jobs finish before exit (graceful shutdown waits up to 30 s).
    stop_grace_period: 35s
    restart: unless-stopped

  # Optional real malware scanner (ADR-0021): `docker compose --profile scanner up -d` and
  # set DOCUMENT_SCANNER=clamav, CLAMAV_HOST=clamav. Needs ~1.5 GB RAM and downloads
  # signatures on start. Development defaults to the fake scanner (no protection).
  clamav:
    image: clamav/clamav:1.4
    profiles: [scanner]
    networks: [private]
    restart: unless-stopped

  ai-service:
    build:
      context: ./ai-service
      target: runtime
    image: healthbridge-ai:local
    environment:
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DB_HOST: postgres
      DB_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:?}
      DB_AI_USER: ${DB_AI_USER:?}
      DB_AI_PASSWORD: ${DB_AI_PASSWORD:?}
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:?}
      LLM_PROVIDER: ${LLM_PROVIDER:-fake}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LLM_MODEL_DEFAULT: ${LLM_MODEL_DEFAULT:-claude-opus-5-5}
      LLM_MODEL_FAST: ${LLM_MODEL_FAST:-claude-haiku-4-5}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-60}
      LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-2}
      LLM_REFUSAL_FALLBACK: ${LLM_REFUSAL_FALLBACK:-true}
      LLM_EXTERNAL_PROCESSING_APPROVED: ${LLM_EXTERNAL_PROCESSING_APPROVED:-false}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-hashing}
      VOYAGE_API_KEY: ${VOYAGE_API_KEY:-}
      VOYAGE_MODEL: ${VOYAGE_MODEL:-voyage-3.5}
    depends_on:
      postgres: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    # Intentionally no published ports: internal only.
    networks: [private]
    restart: unless-stopped

  # Optional real video (ADR-0028): `npm start -- --video` (or `--profile video` with
  # VIDEO_PROVIDER=livekit). Media flows browser ↔ LiveKit directly; the API only issues
  # short-lived room tokens. Loopback ports: signalling 7880, RTC over TCP 7881 / UDP 7882.
  livekit:
    image: livekit/livekit-server:v1.13.7
    profiles: [video]
    environment:
      LIVEKIT_KEYS: '${LIVEKIT_API_KEY:-hb-dev}: ${LIVEKIT_API_SECRET:-}'
      LIVEKIT_CONFIG: |
        port: 7880
        rtc:
          tcp_port: 7881
          udp_port: 7882
          use_external_ip: false
          node_ip: 127.0.0.1
        room:
          empty_timeout: 300
          max_participants: 4
        logging:
          level: info
    ports:
      - '127.0.0.1:${HOST_PORT_LIVEKIT:-7880}:7880'
      - '127.0.0.1:7881:7881'
      - '127.0.0.1:7882:7882/udp'
    networks: [private]
    restart: unless-stopped

  # Optional observability stack (ADR-0027): `docker compose --profile observability up -d`.
  # Loopback-only ports; Grafana refuses to start without GRAFANA_ADMIN_PASSWORD.
  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: [observability]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./infra/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/observability/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    ports:
      - '127.0.0.1:${HOST_PORT_PROMETHEUS:-9090}:9090'
    networks: [private]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.1.0
    profiles: [observability]
    entrypoint:
      - sh
      - -c
      - '[ -n "$$GF_SECURITY_ADMIN_PASSWORD" ] || { echo "GRAFANA_ADMIN_PASSWORD is required" >&2; exit 1; }; exec /run.sh'
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
      GF_SECURITY_COOKIE_SAMESITE: strict
      GF_SECURITY_DISABLE_GRAVATAR: 'true'
    volumes:
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on: [prometheus]
    ports:
      - '127.0.0.1:${HOST_PORT_GRAFANA:-3001}:3000'
    networks: [private]
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    image: healthbridge-web:local
    environment:
      # Set by `npm start -- --video`: camera/microphone for this origin, and the LiveKit
      # signalling origin in the CSP.
      HB_MEDIA: ${HB_MEDIA:-off}
      HB_CSP_CONNECT_EXTRA: ${HB_CSP_CONNECT_EXTRA:-}
    depends_on:
      api: { condition: service_healthy }
    ports:
      - '127.0.0.1:${HOST_PORT_WEB:-8080}:8080'
    networks: [edge, storage]
    restart: unless-stopped

networks:
  # Public-facing tier: Nginx ↔ API only.
  edge:
  # Data and internal services. The web/Nginx container is not attached.
  private:
  # Nginx ↔ MinIO only (presigned document uploads/downloads).
  storage:

volumes:
  postgres-data:
  redis-data:
  minio-data:
  prometheus-data:
  grafana-data:
