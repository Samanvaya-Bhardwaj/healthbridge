# Prometheus (M11, ADR-0027). Scrapes the internal metrics listeners on the private
# network. Metrics carry low-cardinality labels only: no identifiers, no patient content.
global:
  scrape_interval: 15s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: api
    static_configs:
      - targets: ['api:9464']
  - job_name: worker
    static_configs:
      - targets: ['worker:9465']
  - job_name: ai-service
    metrics_path: /metrics
    static_configs:
      - targets: ['ai-service:8000']
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
