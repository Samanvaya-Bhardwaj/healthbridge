# HealthBridge edge: serves the SPA and reverse-proxies the public API.
# Not proxied (internal only): /health/*, metrics, the AI service.
# Development / behind a TLS load balancer. Self-hosted staging and production use
# default.tls.conf (selected with HB_TLS=on).

# Reuse a safe upstream request ID, otherwise generate one.
map $http_x_request_id $hb_request_id {
    default                     $request_id;
    "~^[A-Za-z0-9-]{16,64}$"    $http_x_request_id;
}

# Scheme reported to the API. Behind a TLS-terminating load balancer (ECS + ALB) the
# balancer's X-Forwarded-Proto is passed on; otherwise this server's own scheme.
map $http_x_forwarded_proto $hb_proto {
    default $scheme;
    https   https;
}

limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=20r/s;
limit_req_status 429;

upstream healthbridge_api {
    server api:4000;
    keepalive 32;
}

server {
    listen 8080;
    server_name _;
    server_tokens off;
    include /etc/nginx/snippets/app.conf;
}
