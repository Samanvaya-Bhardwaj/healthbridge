# HealthBridge edge: serves the SPA and reverse-proxies the public API.
# Not proxied (internal only): /health/*, metrics, the AI service.
# TLS terminates here in staging/production (see infra/nginx/tls.conf.example).

# Reuse a safe upstream request ID, otherwise generate one.
map $http_x_request_id $hb_request_id {
    default                     $request_id;
    "~^[A-Za-z0-9-]{16,64}$"    $http_x_request_id;
}

limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=20r/s;
limit_req_status 429;

upstream healthbridge_api {
    server api:4000;
    keepalive 32;
}

server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Uploads go directly to object storage via presigned URLs; API bodies are small.
    client_max_body_size 1m;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Edge liveness for load balancers (does not touch the API).
    location = /healthz {
        access_log off;
        include /etc/nginx/snippets/security-headers.conf;
        default_type text/plain;
        return 200 "ok\n";
    }

    # API responses carry the backend's own security headers (no add_header here).
    location /api/ {
        limit_req zone=api_per_ip burst=40 nodelay;

        proxy_pass http://healthbridge_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Request-Id $hb_request_id;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_hide_header X-Powered-By;
    }

    # Fingerprinted build assets: cache forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # Never serve source maps publicly.
    location ~* \.map$ {
        return 404;
    }

    # SPA fallback; the HTML shell is never cached so deployments take effect immediately.
    location / {
        add_header Cache-Control "no-store" always;
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }
}
