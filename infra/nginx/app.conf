# Application routes shared by the plain-HTTP (development) and TLS (staging/
# production) server blocks: SPA, public API proxy and document storage.
# Included inside a `server { }` block; see default.conf and default.tls.conf.

root /usr/share/nginx/html;
index index.html;

# Uploads go directly to object storage via presigned URLs; API bodies are small.
client_max_body_size 1m;

gzip on;
gzip_types text/plain text/css application/javascript application/json image/svg+xml;
gzip_min_length 1024;

# Edge liveness for load balancers (does not touch the API).
location = /healthz {
    access_log off;
    include /etc/nginx/snippets/security-headers.conf;
    default_type text/plain;
    return 200 "ok\n";
}

# API responses carry the backend's own security headers (no add_header here).
location /api/ {
    limit_req zone=api_per_ip burst=40 nodelay;

    proxy_pass http://healthbridge_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Request-Id $hb_request_id;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $hb_proto;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    proxy_hide_header X-Powered-By;
}

# Medical-document object storage (ADR-0021): browsers upload with presigned POSTs
# and download with short-lived presigned GETs issued by the API after authorisation.
# Same origin as the SPA (CSP connect-src 'self'); MinIO stays off the edge network.
# Host is preserved so the SigV4 signature (computed for this origin) validates.
# BEGIN storage-proxy (removed when HB_STORAGE_PROXY=off, e.g. S3 on AWS)
location ^~ /healthbridge-documents {
    limit_except GET HEAD POST { deny all; }
    limit_req zone=api_per_ip burst=40 nodelay;
    client_max_body_size 26m;
    proxy_pass http://minio:9000;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;
    proxy_request_buffering off;
    proxy_read_timeout 60s;
    proxy_hide_header X-Amz-Request-Id;
    proxy_hide_header X-Amz-Id-2;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cache-Control "no-store" always;
    add_header Referrer-Policy "no-referrer" always;
}
# END storage-proxy

# Fingerprinted build assets: cache forever.
location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable" always;
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri =404;
}

# Never serve source maps publicly.
location ~* \.map$ {
    return 404;
}

# SPA fallback; the HTML shell is never cached so deployments take effect immediately.
location / {
    add_header Cache-Control "no-store" always;
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri $uri/ /index.html;
}
