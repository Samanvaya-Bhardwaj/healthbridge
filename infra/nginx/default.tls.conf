# HealthBridge edge: serves the SPA and reverse-proxies the public API.
# Not proxied (internal only): /health/*, metrics, the AI service.
# Staging/production variant: TLS on 8443, plain HTTP on 8080 only for ACME and redirects.

# Reuse a safe upstream request ID, otherwise generate one.
map $http_x_request_id $hb_request_id {
    default                     $request_id;
    "~^[A-Za-z0-9-]{16,64}$"    $http_x_request_id;
}

# TLS terminates in this server: report its own scheme, never a client-supplied one.
map $scheme $hb_proto {
    default $scheme;
}

limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=20r/s;
limit_req_status 429;

upstream healthbridge_api {
    server api:4000;
    keepalive 32;
}

# Plain HTTP: ACME HTTP-01 challenges, the load-balancer health probe, and redirects.
server {
    listen 8080;
    server_name _;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
    }
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 8443 ssl;
    http2 on;
    server_name _;
    server_tokens off;

    # Certificates are mounted at runtime (Let's Encrypt via the certbot service, or the
    # platform's secret store); they are never part of the image or the repository.
    ssl_certificate     /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:TLS:10m;
    ssl_session_tickets off;

    include /etc/nginx/snippets/app.conf;
}
