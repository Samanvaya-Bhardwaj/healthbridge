# Security headers for responses served by Nginx itself (SPA shell, static assets).
# Not used for /api/: the backend sets its own stricter headers (CSP default-src 'none').
# Nginx does not inherit add_header into a location that declares its own, so every
# static location includes this file.
# HSTS is ignored by browsers over plain HTTP (development) and binding over HTTPS.
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
# Payments (ADR-0020): Razorpay Checkout loads its script, renders in an iframe and may
# open bank/UPI pop-ups; only those origins are allowed, nothing broader.
add_header Permissions-Policy "camera=__HB_MEDIA_ALLOW__, microphone=__HB_MEDIA_ALLOW__, geolocation=(), payment=(self \"https://api.razorpay.com\")" always;
add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://checkout.razorpay.com; style-src 'self'; img-src 'self' data: blob: https://cdn.razorpay.com; font-src 'self'; connect-src 'self' https://api.razorpay.com https://lumberjack.razorpay.com __HB_CSP_CONNECT_EXTRA__; frame-src https://api.razorpay.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
add_header X-Request-Id $hb_request_id always;
